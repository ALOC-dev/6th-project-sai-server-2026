# .github/workflows/claude-code-review.yml
# PR이 열리거나 draft에서 Ready로 바뀔 때 CLAUDE.md 기준으로 전체 리뷰합니다.
# 커밋을 추가해도 자동으로 다시 리뷰하지 않습니다(토큰 절약). 다시 리뷰가 필요하면 PR에 `re-review` 라벨을 붙이세요.
# 다시 리뷰는 직전 리뷰 이후 바뀐 부분만 보고, 끝나면 라벨을 자동으로 뗍니다.
# 사전 준비: claude setup-token 으로 발급한 토큰을 Settings > Secrets > Actions 에 CLAUDE_CODE_OAUTH_TOKEN 으로 등록,
#           Claude GitHub App(https://github.com/apps/claude) 설치
name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review, labeled]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    # 다른 라벨을 붙일 때는 돌지 않는다.
    if: >-
      github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' || github.event.label.name == 're-review')
    # 같은 PR에 리뷰가 겹치면 이전 리뷰는 취소 (비용 절약)
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # 다시 리뷰일 때 직전 리뷰가 본 커밋을 찾아, 그 이후 변경만 파일로 만든다.
      # 직전 리뷰를 찾지 못하거나 강제 푸시로 이력이 바뀌었으면 전체 리뷰로 돌아간다.
      - name: Prepare review scope
        id: scope
        run: |
          mode=full
          if [ "${{ github.event.action }}" = "labeled" ]; then
            prev=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" --paginate \
              --jq '.[] | select(.user.login == "claude[bot]") | .body | capture("reviewed-sha: (?<sha>[0-9a-f]{40})").sha' | tail -n 1)
            if [ -n "$prev" ] && git merge-base --is-ancestor "$prev" "$HEAD_SHA"; then
              git diff "$prev" "$HEAD_SHA" > .review-incremental.diff
              git log --oneline "$prev..$HEAD_SHA" > .review-incremental-commits.txt
              mode=incremental
              echo "prev=$prev" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: '{"attribution": {"commit": "", "pr": "", "sessionUrl": false}}'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}
            REVIEW MODE: ${{ steps.scope.outputs.mode }}

            저장소 루트의 CLAUDE.md와 .github/claude-review.md를 읽고, claude-review.md의 지침을 그대로 따르세요.

            REVIEW MODE가 full이면:
            1. gh pr view로 PR 설명을 읽고 목적과 "리뷰 받고 싶은 부분"을 파악하세요.
            2. gh pr diff로 변경을 보고, Read/Grep으로 호출부·관련 Service·테스트까지 읽어 영향 범위를 확인하세요.
            3. 변경된 도메인의 "도메인 규칙"을 기준으로 위반 여부를 확인하세요.
            4. 구체적인 지적은 인라인 코멘트로, 마지막에 요약 코멘트 하나를 남기세요.

            REVIEW MODE가 incremental이면 직전 리뷰(${{ steps.scope.outputs.prev }}) 이후 바뀐 부분만 다시 리뷰합니다:
            1. gh pr view --comments로 PR 설명과 이전 리뷰 총평·답글을 읽어, 이미 지적했거나 작성자가 답한 내용을 파악하세요.
            2. .review-incremental-commits.txt(추가된 커밋)와 .review-incremental.diff(직전 리뷰 이후 변경)를 읽으세요. 리뷰 대상은 이 diff뿐입니다.
            3. 이전 지적이 이 변경으로 제대로 반영됐는지 확인하고, 이 변경이 새로 만든 문제만 지적하세요.
               이미 지적한 내용, 작성자가 "미반영: 이유"로 답한 내용, 이전 리뷰와 반대되는 의견은 반복하지 마세요.
            4. 새 지적은 인라인 코멘트로, 마지막에 요약 코멘트 하나를 남기세요. 요약 첫 줄에 "재리뷰 (직전 리뷰 이후 변경)"라고 적으세요.

            요약 코멘트 맨 끝에 다음 줄을 그대로 넣으세요(다음 재리뷰의 기준점입니다): <!-- reviewed-sha: ${{ github.event.pull_request.head.sha }} -->
          claude_args: |
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

      # 다음에도 라벨을 붙이기만 하면 다시 리뷰되도록 뗀다.
      - name: Remove re-review label
        if: always() && github.event.action == 'labeled'
        run: gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}" --remove-label re-review
