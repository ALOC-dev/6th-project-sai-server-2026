spring:
  application:
    name: sai
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 5s

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
jwt:
  secret: ${JWT_SECRET}
  access-expiration-ms: 3600000      # 1시간
  refresh-expiration-ms: 1209600000  # 14일
kakao:
  user-info-uri: https://kapi.kakao.com/v2/user/me
