spring:
  application:
    name: sai
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 5s
  servlet:
    multipart:
      # 프로필 이미지 용량(5MB)은 서비스에서 검사해 안내 문구를 돌려준다. 여기서는 그보다 넉넉하게 막는다.
      max-file-size: 10MB
      max-request-size: 10MB

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
jwt:
  secret: ${JWT_SECRET}
  access-expiration-ms: 3600000      # 1시간
  refresh-expiration-ms: 1209600000  # 14일
kakao:
  # 카카오 디벨로퍼스 앱 ID. 비밀값이 아니며, 이 앱에서 발급된 토큰만 로그인에 받는다.
  app-id: 1635056
  token-info-uri: https://kapi.kakao.com/v1/user/access_token_info
  user-info-uri: https://kapi.kakao.com/v2/user/me
expo:
  push-uri: https://exp.host/--/api/v2/push/send
uos:
  api-base-url: https://wise.uos.ac.kr
  api-key: ${UOS_API_KEY}
  sync:
    enabled: true
friend:
  # 초대 링크 도메인은 FE와 딥링크 설정을 확정하면 바꾼다.
  invite-base-url: https://sai.app/invite
# 자격 증명은 설정 파일에 두지 않는다. S3Config 참고
aws:
  region: ${AWS_REGION}
  s3:
    bucket: ${AWS_S3_BUCKET}

